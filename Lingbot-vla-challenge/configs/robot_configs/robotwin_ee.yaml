# RoboTwin in the ABSOLUTE END-EFFECTOR action space (data.action_space: ee).
#
# Reads RoboTwin_lerobot_v30_ee, where `observation.state` and `action` ARE the
# 16-dim EE vectors (the joint columns are not present). That is the only
# difference from robotwin.yaml -- same column names, same cameras, same
# absolute targets -- so the two datasets are drop-in alternatives.
#
# Layout of the 16-dim observation.state / action column:
#     0: 3   left  ee xyz
#     3: 7   left  ee quaternion (wxyz)
#     7: 8   left  gripper
#     8:11   right ee xyz
#    11:15   right ee quaternion (wxyz)
#    15:16   right gripper
#
# This is the packing RoboTwin's `take_action(action, action_type='ee')`
# consumes, so an action chunk can be fed back to the simulator unchanged.
#
# `subtract_state: False` keeps the targets ABSOLUTE, so no rotation arithmetic
# happens on this path at all. The relative counterpart is robotwin_ee_rel.yaml.

# The quaternions above are WXYZ, the RoboTwin convention (its endpose comes from
# transforms3d.quaternions.mat2quat). Declared even though the absolute path never
# does rotation math: it documents the column layout, and it is the same fact
# robotwin_ee_rel.yaml depends on. See docs/config/action_space.md.
quat_convention: wxyz

states:
  - observation.state.end.position:
      origin_keys:
        - observation.state:
            start: 0
            end: 7
        - observation.state:
            start: 8
            end: 15

  - observation.state.effector.position:
      origin_keys:
        - observation.state:
            start: 7
            end: 8
        - observation.state:
            start: 15
            end: 16

actions:
  - action.end.position:
      origin_keys:
        - action:
            start: 0
            end: 7
        - action:
            start: 8
            end: 15
      subtract_state: False

  - action.effector.position:
      origin_keys:
        - action:
            start: 7
            end: 8
        - action:
            start: 15
            end: 16
      subtract_state: False

images:
  - observation.images.camera_top:
      origin_keys: observation.images.cam_high
  - observation.images.camera_wrist_left:
      origin_keys: observation.images.cam_left_wrist
  - observation.images.camera_wrist_right:
      origin_keys: observation.images.cam_right_wrist

norm_stats: assets/norm_stats/robotwin_ee.json
