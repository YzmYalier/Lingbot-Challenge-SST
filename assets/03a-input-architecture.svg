<svg xmlns="http://www.w3.org/2000/svg" id="diagram-extra-view" class="method-svg" width="960" height="652" viewBox="0 0 960 652" role="img" aria-labelledby="diagram-extra-view-title diagram-extra-view-desc">
<title id="diagram-extra-view-title">03.a · 从输入侧加入 SAM 视角</title>
<desc id="diagram-extra-view-desc">保留原始主视角与左右腕图像，将主视角的 SAM 渲染图追加为第四张图。四张图共享 ViT 与 visual merger，依次与语言、原有 Depth/Video query 构成 VLM prefix。对 SAM 图比较三种 MRoPE 位置编码与两种 attention mask；动作专家读取 prefix K/V，并根据状态、带噪动作与时间步预测动作。SAM 图在训练和推理时都输入。</desc>
