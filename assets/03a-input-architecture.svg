#diagram-extra-view text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'WenQuanYi Micro Hei', sans-serif; font-size: 16px; fill: #273731; }
#diagram-extra-view .figure-title { font-size: 22px; font-weight: 600; }
#diagram-extra-view .strong { font-weight: 600; }
#diagram-extra-view .muted { fill: #63746b; }
#diagram-extra-view .teal { fill: #356e65; }
#diagram-extra-view .copper { fill: #aa573b; }
</style>
