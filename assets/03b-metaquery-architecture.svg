<svg xmlns="http://www.w3.org/2000/svg" id="diagram-metaquery" class="method-svg" width="960" height="878" viewBox="0 0 960 878" role="img" aria-labelledby="diagram-metaquery-title diagram-metaquery-desc">
<title id="diagram-metaquery-title">03.b · 用 MetaQuery 学习 SAM 掩码</title>
<desc id="diagram-metaquery-desc">策略仍输入三张原图。图像和语言 token 后插入可学习 SAM Query，再接原有 Depth/Video query，整个 VLM prefix 使用 causal attention。动作专家可以读取 SAM Query，其在推理中保留。训练专用的 B 型掩码头将主视角 hidden 投影为像素 embedding F，将 SAM Query hidden 投影为 mask embedding e，通过点积及 query 维度最大值形成 32×32 掩码 logits，以离线 SAM 目标计算 BCE 与 Dice loss。推理移除掩码预测头和损失。</desc>
