#diagram-metaquery .figure-title { font-size: 22px; font-weight: 600; }
#diagram-metaquery .strong { font-weight: 600; }
#diagram-metaquery .muted { fill: #63746b; }
#diagram-metaquery .teal { fill: #356e65; }
#diagram-metaquery .copper { fill: #aa573b; }
</style>
